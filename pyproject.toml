[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "researchbench"
version = "0.1.0"
description = "A comprehensive benchmark for evaluating AI academic and research capabilities"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [{name = "CAOShurong", email = "170531907+CAOShurong@users.noreply.github.com"}]
keywords = ["benchmark", "ai", "research", "academic", "evaluation", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Education :: Testing",
]
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "click>=8.0",
    "rich>=13.0",
]

[project.urls]
Homepage = "https://github.com/CAOShurong/researchbench"
Repository = "https://github.com/CAOShurong/researchbench"
Documentation = "https://github.com/CAOShurong/researchbench#readme"
Issues = "https://github.com/CAOShurong/researchbench/issues"
Changelog = "https://github.com/CAOShurong/researchbench/releases"

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov", "ruff", "mypy"]
judge = ["openai>=1.0", "anthropic>=0.20"]

[project.scripts]
researchbench = "researchbench.cli:main"

[tool.setuptools]
packages = {find = {where = ["src"]}}

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.mypy]
python_version = "3.9"
warn_unused_ignores = true
