name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.9', '3.11', '3.13']
      fail-fast: false

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
    - name: Lint
      run: |
        ruff check src tests
        ruff format --check src tests
    - name: Test (with coverage gate)
      run: |
        pytest tests --cov=researchbench --cov-report=term-missing --cov-fail-under=80

  typecheck:
    name: typecheck (mypy, py3.11)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
    - name: mypy
      run: mypy src

  build:
    name: build + clean-install smoke test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install build
      run: pip install build
    - name: Build sdist and wheel
      run: python -m build
    - name: Install wheel in clean venv and smoke test
      run: |
        python -m venv /tmp/rb-venv
        /tmp/rb-venv/bin/python -m pip install dist/*.whl
        /tmp/rb-venv/bin/researchbench --version
        /tmp/rb-venv/bin/researchbench list
        /tmp/rb-venv/bin/researchbench run --tasks paper_comprehension --model gpt-4o --allow-draft --format json